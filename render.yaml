# Render blueprint: one web service that serves both the API and the frontend.
#
# Deploying two services (API + static site) would mean CORS configuration, a
# second URL, and two origins to register with Google. FastAPI serves
# frontend/ as static files instead, so there is one URL for everything.
#
# To use: Render dashboard -> New -> Blueprint -> pick this repo.
# Then set the four secret env vars marked sync:false in the dashboard.

services:
  - type: web
    name: gooddeed-go
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # $PORT is provided by Render; binding 0.0.0.0 is required or the health
    # check cannot reach the process.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # --- secrets: set these in the Render dashboard --------------------
      # Supabase connection string. Use the **Session pooler** URI (port
      # 5432 on the pooler host), not the direct one: Render's free tier is
      # IPv4-only and Supabase's direct host is IPv6-only.
      - key: DATABASE_URL
        sync: false

      # Set ONE of these two. OpenAI wins if both are present.
      - key: OPENAI_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # Google OAuth client ID (public, not a secret -- but environment
      # specific, so it is not committed).
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Shared secret the cron job below presents to
      # POST /admin/refresh-opportunities. Leave it unset and that endpoint
      # returns 404 rather than standing open.
      - key: REFRESH_TOKEN
        generateValue: true

  # Refreshes the cached opportunity areas at 08:00 UTC daily, so the first
  # person to open the map each morning gets warm results instead of paying
  # for a Google fan-out. The web service also arms an in-process timer, but
  # free-tier services sleep when idle, so this is the one that reliably
  # fires.
  - type: cron
    name: gooddeed-daily-refresh
    runtime: python
    plan: starter          # cron jobs are not available on the free plan
    region: oregon
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      curl -fsS -X POST "https://$APP_HOST/admin/refresh-opportunities"
      -H "X-Refresh-Token: $REFRESH_TOKEN"
    envVars:
      - key: APP_HOST
        fromService:
          type: web
          name: gooddeed-go
          property: host
      - key: REFRESH_TOKEN
        fromService:
          type: web
          name: gooddeed-go
          envVarKey: REFRESH_TOKEN
